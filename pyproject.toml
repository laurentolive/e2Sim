[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e2sim"
dynamic = ["version"]
description = "Embedded firmware simulation on PC: unchanged firmware on a simulated HAL, deterministic virtual time"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "Laurent Olive" }]
dependencies = ["pyyaml>=6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Testing",
    "Framework :: Pytest",
]

[project.optional-dependencies]
test = ["pytest>=7"]
report = ["openpyxl>=3"]

[project.urls]
Homepage = "https://github.com/laurentolive/e2Sim"
Issues = "https://github.com/laurentolive/e2Sim/issues"

[project.scripts]
e2sim = "e2sim.cli:main"

# entry point name = module name: no double registration with pytest_plugins of a conftest
[project.entry-points.pytest11]
"e2sim.pytest_plugin" = "e2sim.pytest_plugin"

[tool.setuptools]
packages = ["e2sim", "e2sim.license"]

[tool.setuptools.package-data]
e2sim = ["web/*.html"]

[tool.setuptools.dynamic]
version = { attr = "e2sim.__version__" }

# SDK compiled with the firmwares (runner, e2sim.h, make rules): <prefix>/share/e2sim, see `e2sim root`
[tool.setuptools.data-files]
"share/e2sim/target/include" = ["target/include/e2sim.h"]
"share/e2sim/target/src" = ["target/src/e2sim_runner.c", "target/src/e2sim_wire.c", "target/src/e2sim_wire.h"]
"share/e2sim/target" = ["target/LICENSE.md"]
"share/e2sim/mk" = ["mk/e2sim.mk"]
